name: Build & deploy

# Push to `main` → build the image on a runner → push to GHCR → ssh to the
# host → pull → recreate boholz-website-prod. The host does no building.
#
# WHY THIS IS ONLY NOW POSSIBLE
#   Until the content moved into src/domain as TypeScript, `bun run build`
#   queried Postgres: getStaticPaths enumerated every house, showhouse,
#   article and landing page. A GitHub runner cannot reach sn-c1's docker
#   network, so the build had to happen on the host beside the database, and
#   production was a hand-built local tag. The build now needs no network at
#   all, which is what lets it move off the host.
#
# WHY THE DOCKERFILE AND NOT RAILPACK
#   Astro/Vite inline PUBLIC_* vars into the client bundle at BUILD time, so
#   they must be present during `bun run build` — passing them at `docker run`
#   does nothing. Railpack ignores ./Dockerfile and never received them, which
#   shipped images with an empty PUBLIC_ASSETS_URL (every photo 404s). The
#   Dockerfile takes them as ARGs, so we build with it and pass --build-arg.
#
#   These three are NOT secrets — they are readable in View-Source — so they
#   live in repo Variables, not Secrets. Never pass a real secret as a build
#   arg: it is permanently visible in `docker history`. Build-time secrets
#   (none needed here) belong in a BuildKit `--mount=type=secret`.
#
# REPO VARIABLES  (Settings → Secrets and variables → Actions → Variables)
#   PUBLIC_ASSETS_URL          https://boholz-haus.de/m
#                              Baked into every <img> src at build time, so it
#                              must match what the media Worker serves. A wrong
#                              value 404s every photo on the site and the build
#                              still succeeds.
#   PUBLIC_TURNSTILE_SITE_KEY  Cloudflare Turnstile site key
#   PUBLIC_GTM_ID              GTM-XXXXXXX
#
# VERIFY A BUILD
#   docker pull ghcr.io/<owner>/<repo>:dev
#   docker run --rm --entrypoint sh ghcr.io/<owner>/<repo>:dev \
#     -c "grep -rl 'boholz-haus.de/m' dist/client | head"
#   No hits ⇒ PUBLIC_ASSETS_URL did not bake in.
#   docker history --no-trunc <image>   ⇒ confirm no secret leaked in.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GHCR requires a lowercase path; GitHub owner/repo may not be.
      - name: Compute image name
        id: meta
        run: |
          IMAGE="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # Provides the BuildKit builder that build-push-action drives. Replaces
      # the hand-rolled `docker run --privileged moby/buildkit` we used before.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Must precede the build: build-push-action pushes as part of the build.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :main is the rolling tag the host pulls. :main-<sha> is immutable and
      # is what you roll back to — a tag moves, a sha-pinned tag never does.
      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          pull: true
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:main
            ${{ steps.meta.outputs.image }}:main-${{ github.sha }}
          build-args: |
            PUBLIC_ASSETS_URL=${{ vars.PUBLIC_ASSETS_URL }}
            PUBLIC_TURNSTILE_SITE_KEY=${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
            PUBLIC_GTM_ID=${{ vars.PUBLIC_GTM_ID }}
          secrets: |
            google_places=${{ secrets.GOOGLE_PLACES_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo '```'
            echo "${{ steps.meta.outputs.image }}:main"
            echo "${{ steps.meta.outputs.image }}:main-${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to sn-c1
    runs-on: ubuntu-latest
    needs: build
    # No separate quality gate is needed: `docker build` runs `bun run build`,
    # so a broken build produces no image and `needs: build` stops us here.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ needs.build.outputs.image }}:main
          # Read via env, not interpolated into the script: a ${{ }} secret is
          # substituted into the command line and would land in the host's
          # shell history and process list. GITHUB_TOKEN is no use here — it is
          # only valid on the runner, not on the host.
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: IMAGE,GHCR_TOKEN
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            CONTAINER="boholz-website-prod"
            NETWORK="web-network"
            LEADS="$APP_DIR/leads"

            # Runtime secrets (MS_GRAPH_*, TURNSTILE_SECRET) live here and are
            # read by node at boot — never baked into the image. Missing file
            # means a container that starts and then fails every form
            # submission, so fail loudly instead.
            if [ ! -f "$APP_DIR/.env" ]; then
              echo "ERROR: missing $APP_DIR/.env on the host" >&2
              exit 1
            fi

            # Enquiries whose notification email fails are appended here by
            # logLead. Bind-mounted at the same path it has inside the
            # container. Created here rather than assumed: docker would make it
            # root-owned, which would stop us rotating it as this user.
            mkdir -p "$LEADS"

            docker network inspect "$NETWORK" >/dev/null 2>&1 \
              || docker network create "$NETWORK"

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "${{ secrets.GHCR_PULL_USER }}" --password-stdin
            docker pull "$IMAGE"

            docker rm -f "$CONTAINER" 2>/dev/null || true
            # No published host port: sn-c1-gateway reaches the container by
            # name on web-network and the tunnel routes boholz-haus.de to it.
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              --network "$NETWORK" \
              --env-file "$APP_DIR/.env" \
              -v "$LEADS":/opt/tenants/boholz/website/leads \
              "$IMAGE"

            # Don't report success just because `docker run` returned. Poll
            # until the app actually answers, and dump logs if it never does.
            echo "Waiting for the app to respond…"
            for i in $(seq 1 30); do
              if docker exec "$CONTAINER" node -e \
                   "fetch('http://127.0.0.1:4321/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" \
                   2>/dev/null; then
                echo "Healthy after ${i}s."
                docker image prune -f
                docker ps --filter "name=$CONTAINER"
                exit 0
              fi
              sleep 1
            done

            echo "ERROR: app did not become healthy in 30s. Recent logs:" >&2
            docker logs --tail 50 "$CONTAINER" >&2
            exit 1
